<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>
<body class="bg-gray-100 font-sans p-10"> 
    <form action="/add" method="post">
        <input type="text" name="nome" placeholder="Nome do Dispositivo" required>
        <input type="text" name="host" placeholder="Host" required>
        <input type="text" name="url" placeholder="URL" required>
        <button type="submit">Adicionar Dispositivo</button>
    </form>

    <table class="min-w-full bg-white rounded-lg shadow-md overflow-hidden">
        <thead>
            <tr>
                <th scope="col">Dispositivo</th>
                <th scope="col">Ping</th>
                <th scope="col">HTTP</th>
            </tr>
        </thead>
    <tbody>
        {% for dispositivo in dispositivos %}
        <tr>
            <td>{{ dispositivo.nome }}</td>
            <td>{{ dispositivo.ping_status }}</td>
            <td> {% if dispositivo.http_status == 'ONLINE' %} Online {% elif dispositivo.http_status == 'OFFLINE' %} Offline {% else %} N/A {% endif %} </td>
            <td>
            <form action="/remover/{{dispositivo.id}}" method="post" style="display: inline;">
                <button type="submit">Deletar</button>
            </form>
            </td>
            

        </tr>
        {% endfor %}

    </tbody>
    </table>
</body>
</html>
